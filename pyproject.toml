[project]
name = "rusthinq-local"
version = "0.1.1"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
# Pinned like ildevice-homeassistant's, so both test against the same Home Assistant.
test = [
    "pytest-homeassistant-custom-component==0.13.366",
    "rusthinq==0.2.3",  # the embedded tests run the real daemon; keep equal to const.REQUIREMENT
    "ildevice-homeassistant==0.2.1",  # the ildevice hub; keep equal to the manifest's requirement
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
